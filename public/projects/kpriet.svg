<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="400" cy="225" r="280" fill="url(#amberGlow)" />

  <!-- Grid decoration -->
  <g stroke="#27272a" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Central Phone / QR Frame graphic -->
  <g transform="translate(400, 205)">
    <!-- QR Card Container -->
    <rect x="-140" y="-120" width="280" height="190" rx="16" fill="#27272a" stroke="#f59e0b" stroke-width="2" opacity="0.9" />
    
    <!-- QR Code abstract icon -->
    <rect x="-105" y="-90" width="60" height="60" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    <rect x="-93" y="-78" width="36" height="36" rx="4" fill="#f59e0b" />
    <rect x="-85" y="-70" width="20" height="20" rx="2" fill="#18181b" />

    <!-- Details lines -->
    <rect x="-25" y="-85" width="120" height="10" rx="5" fill="#f59e0b" opacity="0.9" />
    <rect x="-25" y="-65" width="90" height="8" rx="4" fill="#71717a" />
    <rect x="-25" y="-48" width="110" height="8" rx="4" fill="#52525b" />

    <!-- Status badge -->
    <rect x="-105" y="-10" width="210" height="34" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="-85" cy="7" r="5" fill="#22c55e" />
    <text x="-70" y="12" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Verified Meal Attendance</text>

    <!-- Scan Line -->
    <line x1="-120" y1="-60" x2="-30" y2="-60" stroke="#f59e0b" stroke-width="2.5" opacity="0.8" />
  </g>

  <!-- Title Text -->
  <text x="400" y="345" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="1">KPRIET HOSTELLERS APP</text>
  <text x="400" y="375" text-anchor="middle" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="3">FLUTTER • SPRING BOOT • QR MEAL TRACKING</text>
</svg>
